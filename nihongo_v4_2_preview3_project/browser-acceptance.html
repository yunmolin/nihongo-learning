+;renderQuiz()}}function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nihongo-learning-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}// V3 extends V2.2 and preserves its storage key and kana IDs.\nconst BANK_KEY='nihongo-bank-v4';\nconst EXTRA=[];\nconst DOMAINS=['五十音','文字・語彙','文法・讀解','聽解'];\nconst LEVELS=['五十音','N5','N4','N3','N2','N1'];\nconst BUILTIN=AppData.bank.questions;\nlet bankError='';\nfunction validateBank(raw,existing=[]){const incoming=NHCore.validateBank(raw);NHCore.mergeBank(existing,incoming);return incoming}\nlet custom=NHStorage.loadBank(BUILTIN);\nquestions.splice(0,questions.length,...NHCore.mergeBank(BUILTIN,custom));\nconst available=()=>questions.filter(q=>NHCore.isPlayable(q,true));\nconst statusName=s=>({draft:'草稿',pending_review:'待審核',approved:'已核准',published:'已發布',disabled:'已停用'}[s]||s);\nlet filters={level:'all',domain:'all',category:'all',count:'10',mode:'random'};\nlet pendingImport=null;\nconst legacyGo=go,legacyRender=renderQuiz,legacyAnswer=answer,legacySave=save;\nfunction updateHero(){const s=stats();document.getElementById('heroStat').textContent=`累積 ${s.n} 次作答 · 正確率 ${s.pct}%`}\nfunction statusBox(id,message,error=false){const el=document.getElementById(id);if(el){el.className='status '+(error?'error':'good');el.textContent=message}}\nfunction optionList(list,value,all='全部'){return `\u003coption value=\"all\">${all}\u003c/option>`+list.map(v=>`\u003coption value=\"${esc(v)}\" ${value===v?'selected':''}>${esc(v)}\u003c/option>`).join('')}\nfunction practiceDomainId(q){if(filters.level!=='五十音'||q.kind!=='kana')return q.domain;const point=AppData.knowledgePoints.knowledgePoints.find(k=>k.level===q.level&&k.kind===q.kind&&(q.knowledgePointIds?.length?q.knowledgePointIds.includes(k.id):k.category===q.category));return q.categoryId||point?.id||'kana:'+q.category}\nfunction practiceDomainLabel(id){const point=AppData.knowledgePoints.knowledgePoints.find(k=>k.id===id);return id==='kp-kana-kana-002'?'平假名':point?.name||id.replace(/^kana:/,'')}\nfunction filteredPool(){return available().filter(q=>(filters.level==='all'||q.level===filters.level)&&(filters.domain==='all'||practiceDomainId(q)===filters.domain)&&(filters.category==='all'||q.category===filters.category)).filter(q=>filters.mode==='wrong'?wrongIds().includes(q.id):filters.mode==='unseen'?!state.attempts.some(a=>a.id===q.id):true)}\nfunction quizSetup(){\n const pool=available().filter(q=>filters.level==='all'||q.level===filters.level);\n const domains=[...new Set(pool.map(practiceDomainId))];\n if(!domains.includes(filters.domain))filters.domain='all';\n const cats=[...new Set(pool.filter(q=>filters.domain==='all'||practiceDomainId(q)===filters.domain).map(q=>q.category))];\n if(!cats.includes(filters.category))filters.category='all';\n root.innerHTML=panel(`\u003ch2>題庫練習\u003c/h2>\u003cp>選擇級別與分類。作答後立即批改，顯示繁體中文解析。\u003c/p>\u003cdiv class=\"filters\">\u003clabel>級別\u003cselect id=\"filter-level\" onchange=\"changeFilter('level',this.value)\">${optionList(LEVELS,filters.level)}\u003c/select>\u003c/label>\u003clabel>領域\u003cselect id=\"filter-domain\" onchange=\"changeFilter('domain',this.value)\">\u003coption value=\"all\">全部\u003c/option>${domains.map(id=>`\u003coption value=\"${esc(id)}\" ${filters.domain===id?'selected':''}>${esc(practiceDomainLabel(id))}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel>細分類\u003cselect id=\"filter-category\" onchange=\"changeFilter('category',this.value)\">${optionList(cats,filters.category)}\u003c/select>\u003c/label>\u003clabel>題數\u003cselect id=\"filter-count\" onchange=\"changeFilter('count',this.value)\">${[10,20,30,50].map(n=>`\u003coption ${String(n)===filters.count?'selected':''}>${n}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel>練習方式\u003cselect id=\"filter-mode\" onchange=\"changeFilter('mode',this.value)\">${[['random','隨機練習'],['unseen','未做過的題目'],['wrong','錯題重練'],['weak','弱點強化']].map(([v,t])=>`\u003coption value=\"${v}\" ${filters.mode===v?'selected':''}>${t}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003c/div>\u003cp id=\"pool-count\">符合條件 \u003cstrong>${filteredPool().length}\u003c/strong> 題；不足指定題數時，使用所有符合題目，不重複湊題。\u003c/p>\u003cbutton class=\"btn\" ${filteredPool().length?'':'disabled'} onclick=\"startQuiz('filtered')\">開始練習\u003c/button>\u003cp class=\"muted small\">隨機練習優先抽取較少做過的題目；弱點強化優先抽取答錯比例高的分類。內建題目為示範內容，並非官方試題；N4～N1 可匯入題庫後練習。聽解與完整模擬考尚未提供。\u003c/p>`);\n}\nfunction changeFilter(k,v){filters[k]=v;quizSetup()}\ngo=function(p){\n legacyGo(p);updateHero();\n if(p==='quiz')quizSetup();\n if(p==='bank')renderBank();\n if(p==='home')root.innerHTML+=panel(`\u003ch3>V3 題庫系統\u003c/h3>\u003cp>目前共 ${questions.length} 題，其中 ${available().length} 題可練習。新增分類篩選、JSON 匯入／匯出與學習資料備份。\u003c/p>\u003cp class=\"muted\">保留原五十音與 5 題 N5，另加入 25 題 N5 原創示範。示範題尚未經獨立人工審核；匯入題可標記為待審核。\u003c/p>\u003cbutton class=\"btn\" onclick=\"go('quiz')\">選擇練習範圍\u003c/button> \u003cbutton class=\"btn secondary\" onclick=\"go('bank')\">題庫管理\u003c/button>${bankError?`\u003cp class=\"notice\">${esc(bankError)}\u003c/p>`:''}`);\n if(p==='levels')root.innerHTML=panel(`\u003ch2>分級課程與題庫\u003c/h2>\u003cp>五十音課程保留。N5 目前提供示範練習；完整分級課程尚在規劃。\u003c/p>\u003cdiv class=\"grid\">${LEVELS.slice(1).map(l=>{const n=available().filter(q=>q.level===l).length;return `\u003cdiv class=\"tile\">\u003ch3>${l}\u003c/h3>\u003cp>${n} 題可練習\u003c/p>\u003cbutton class=\"btn\" ${n?'':'disabled'} onclick=\"levelPractice('${l}')\">${n?'開始練習':'尚無題庫'}\u003c/button>\u003c/div>`}).join('')}\u003c/div>`);\n if(p==='review'){\n const missing=wrongIds().filter(id=>!available().some(q=>q.id===id));\n const list=available().filter(q=>wrongIds().includes(q.id));\n root.innerHTML=panel(`\u003ch2>錯題複習\u003c/h2>\u003cp>以每題最新一次結果判斷；重練答對後移出待複習清單，歷史紀錄保留。\u003c/p>\u003cp>${list.length} 題可重練${missing.length?`；另 ${missing.length} 題未載入或不可練習，紀錄仍保留`:''}。\u003c/p>\u003cbutton class=\"btn\" ${list.length?'':'disabled'} onclick=\"startQuiz('wrong')\">複習錯題\u003c/button>${list.map(q=>`\u003cdetails class=\"bank-row\">\u003csummary>${esc(q.level+' · '+q.category+'｜'+q.question)}\u003c/summary>\u003cp>正確答案：${esc(q.options[q.answer])}\u003c/p>\u003cp>${esc(q.explanation)}\u003c/p>\u003c/details>`).join('')}`);\n }\n if(p==='stats'){\n const groups=new Map();for(const a of state.attempts){const q=questions.find(q=>q.id===a.id);const key=q?q.level+' · '+q.domain+' · '+q.category:'未載入題目';const g=groups.get(key)||{n:0,ok:0};g.n++;if(a.correct)g.ok++;groups.set(key,g)}\n root.innerHTML+=panel(`\u003ch3>分類表現\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>分類\u003c/th>\u003cth>作答次數\u003c/th>\u003cth>正確率\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${[...groups].map(([k,g])=>`\u003ctr>\u003ctd>${esc(k)}\u003c/td>\u003ctd>${g.n}\u003c/td>\u003ctd>${Math.round(g.ok/g.n*100)}%\u003c/td>\u003c/tr>`).join('')||'\u003ctr>\u003ctd colspan=\"3\">尚無紀錄\u003c/td>\u003c/tr>'}\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">這是練習正確率，不代表 JLPT 官方尺度得分。\u003c/p>\u003cbutton class=\"btn secondary\" onclick=\"downloadBackup()\">備份題庫與學習紀錄\u003c/button>`);\n }\n};\nfunction levelPractice(l){filters={...filters,level:l,domain:'all',category:'all',mode:'random'};go('quiz')}\nstartQuiz=function(mode){\n let pool=available();\n if(mode==='filtered')pool=filteredPool();\n else if(mode==='wrong')pool=pool.filter(q=>wrongIds().includes(q.id));\n else if(mode==='n5')pool=pool.filter(q=>q.level==='N5');\n else if(mode==='kana')pool=pool.filter(q=>q.level==='五十音');\n else if(mode==='hira')pool=pool.filter(q=>q.category==='假名');\n else if(mode==='kata')pool=pool.filter(q=>q.category==='片假名');\n if(!pool.length){go(mode==='wrong'?'review':'quiz');return}\n const counts=new Map(),group=new Map();state.attempts.forEach(a=>{counts.set(a.id,(counts.get(a.id)||0)+1);const q=questions.find(q=>q.id===a.id);if(q){const k=q.level+'|'+q.domain+'|'+q.category;const g=group.get(k)||{n:0,wrong:0};g.n++;if(!a.correct)g.wrong++;group.set(k,g)}});\n pool=shuffle([...pool]);\n if(mode==='filtered'&&filters.mode==='weak')pool.sort((a,b)=>{const rate=q=>{const g=group.get(q.level+'|'+q.domain+'|'+q.category);return g?g.wrong/g.n:0};return rate(b)-rate(a)||(counts.get(a.id)||0)-(counts.get(b.id)||0)});\n else pool.sort((a,b)=>(counts.get(a.id)||0)-(counts.get(b.id)||0));\n session={list:pool.slice(0,mode==='filtered'?Number(filters.count):10),idx:0,score:0,answered:false,mode};setPage('quiz');renderQuiz();\n};\nrenderQuiz=function(){legacyRender();if(session){const q=session.list[session.idx];root.insertAdjacentHTML('beforeend',panel(`\u003cp class=\"meta\">${esc(q.domain+' / '+q.category+' · '+q.difficulty+' · '+statusName(q.reviewStatus))}\u003cbr>${esc(q.id+' · v'+q.version+' · '+q.source)}\u003c/p>\u003cbutton class=\"btn secondary\" onclick=\"go('quiz')\">結束本次練習\u003c/button>\u003cp class=\"muted small\">已作答的結果會保留。\u003c/p>`))}else root.insertAdjacentHTML('beforeend',panel('\u003cbutton class=\"btn secondary\" onclick=\"go(\\'quiz\\')\">調整練習範圍\u003c/button>'))};\nanswer=function(j){if(!session||session.answered||!Number.isInteger(j)||j\u003c0||j>=session.shuffled.length)return;const before=state.attempts.length;legacyAnswer(j);if(state.attempts.length>before){const a=state.attempts.at(-1),q=session.list[session.idx];a.selectedAnswer=session.shuffled[j].i;a.questionVersion=q.version;save()}updateHero()};\nnextQuestion=function(){if(session&&session.answered){session.idx++;renderQuiz()}};\nfunction downloadJSON(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}\nfunction exportBank(){downloadJSON('nihongo-question-bank-v3.json',{schemaVersion:1,questions})}\nfunction downloadBackup(){downloadJSON('nihongo-backup-v3.json',{type:'nihongo-backup',schemaVersion:1,exportedAt:new Date().toISOString(),customBank:custom,learning:state})}\nfunction renderBank(){\n pendingImport=null;\n root.innerHTML=panel(`\u003ch2>題庫管理\u003c/h2>\u003cp>共 ${questions.length} 題：內建 ${BUILTIN.length}、匯入 ${custom.length}。${available().length} 題可練習。\u003c/p>\u003cp class=\"notice\">此為離線本機管理，資料只存在目前瀏覽器，不是多人後台。系統會檢查格式與重複資料；答案語意及日文自然度仍需人工審核。待審核、停用與聽解題不會進入練習。\u003c/p>\u003cdiv class=\"flex\">\u003cbutton class=\"btn\" onclick=\"exportBank()\">匯出完整題庫 JSON\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"downloadBackup()\">備份題庫與學習紀錄\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"downloadTemplate()\">下載匯入範例\u003c/button>\u003c/div>\u003ch3 style=\"margin-top:24px\">匯入新增題目\u003c/h3>\u003cp class=\"muted\">只新增題目，不覆蓋同 ID 舊題。若要修改題目，請使用新 ID 與版本。完整題庫匯出檔適合保存，匯回相同題庫會被判定為重複。\u003c/p>\u003clabel>選擇 JSON 檔\u003cinput id=\"bank-file\" type=\"file\" accept=\".json,application/json\" onchange=\"readBankFile(this)\">\u003c/label>\u003cp>或貼上 JSON：\u003c/p>\u003clabel for=\"bank-json\">題庫 JSON\u003c/label>\u003ctextarea id=\"bank-json\" placeholder='{\"schemaVersion\":1,\"questions\":[...]}' oninput=\"pendingImport=null;document.getElementById('commit-import').disabled=true\">\u003c/textarea>\u003cdiv class=\"flex\">\u003cbutton class=\"btn secondary\" onclick=\"previewImport()\">檢查並預覽\u003c/button>\u003cbutton class=\"btn\" id=\"commit-import\" disabled onclick=\"commitImport()\">確認匯入\u003c/button>\u003c/div>\u003cp id=\"import-status\" role=\"status\">\u003c/p>\u003cdiv id=\"import-preview\">\u003c/div>\u003cdetails>\u003csummary>欄位格式說明\u003c/summary>\u003cp>必填：id、level、domain、category（細分類）、difficulty、question、四個 options、answer（0 起算）、explanation（繁體中文）、source、reviewStatus、version（正整數）。級別支援五十音、N5～N1；領域支援五十音、文字・語彙、文法・讀解、聽解。\u003c/p>\u003cp>reviewStatus：draft 待審核、approved 已人工審核、sample 示範、disabled 停用。不能把格式檢查當作人工審核。\u003c/p>\u003c/details>`)+panel(`\u003ch3>還原學習備份\u003c/h3>\u003cp class=\"muted\">V3 完整備份會合併紀錄及自訂題庫；也可載入 V2 匯出的學習紀錄 JSON。重複紀錄只保留一份，現有資料不清除。\u003c/p>\u003clabel>選擇備份 JSON\u003cinput id=\"backup-file\" type=\"file\" accept=\".json,application/json\" onchange=\"restoreBackup(this)\">\u003c/label>\u003cp id=\"restore-status\" role=\"status\">\u003c/p>`)+panel(`\u003ch3>題庫清單\u003c/h3>\u003clabel>搜尋題目\u003cinput id=\"bank-search\" type=\"search\" placeholder=\"ID、題目、級別、分類\" oninput=\"renderBankList(this.value)\">\u003c/label>\u003cdiv id=\"bank-list\">\u003c/div>`);\n renderBankList('');\n}\nfunction renderBankList(search){const list=questions.filter(q=>(q.id+' '+q.level+' '+q.domain+' '+q.category+' '+q.question).toLowerCase().includes(search.toLowerCase()));document.getElementById('bank-list').innerHTML=`\u003cp class=\"muted\">找到 ${list.length} 題（最多顯示前 100 題）\u003c/p>`+list.slice(0,100).map(q=>`\u003cdetails class=\"bank-row\">\u003csummary>\u003cspan class=\"pill\">${esc(q.level+' · '+statusName(q.reviewStatus))}\u003c/span> ${esc(q.question)}\u003c/summary>\u003cp class=\"meta\">${esc(q.id+' · '+q.domain+' / '+q.category+' · v'+q.version)}\u003c/p>\u003col type=\"A\">${q.options.map((o,i)=>`\u003cli>${esc(o)}${i===q.answer?' ✔':''}\u003c/li>`).join('')}\u003c/ol>\u003cp>${esc(q.explanation)}\u003c/p>\u003cp class=\"meta\">來源：${esc(q.source)}\u003c/p>\u003c/details>`).join('')}\nasync function readJSONFile(file){if(!file)throw Error('請先選擇檔案。');if(file.size>10*1024*1024)throw Error('檔案不可超過 10 MB。');return JSON.parse((await file.text()).replace(/^\\uFEFF/,''))}\nasync function readBankFile(input){pendingImport=null;document.getElementById('commit-import').disabled=true;try{const raw=await readJSONFile(input.files[0]);document.getElementById('bank-json').value=JSON.stringify(raw,null,2);previewImport()}catch(e){statusBox('import-status',e.message,true)}}\nfunction previewImport(){pendingImport=null;document.getElementById('commit-import').disabled=true;document.getElementById('import-preview').textContent='';try{pendingImport=validateBank(JSON.parse(document.getElementById('bank-json').value.replace(/^\\uFEFF/,'')),questions);statusBox('import-status',`檢查通過，共 ${pendingImport.length} 題。請確認預覽後按「確認匯入」。`);document.getElementById('import-preview').innerHTML=pendingImport.slice(0,10).map(q=>`\u003cp>${esc(q.id+' · '+q.level+' · '+statusName(q.reviewStatus)+' · '+q.question)}\u003c/p>`).join('');document.getElementById('commit-import').disabled=false}catch(e){statusBox('import-status',e.message,true)}}\nfunction commitImport(){if(!pendingImport)return;try{const checked=validateBank({schemaVersion:1,questions:pendingImport},questions),next=[...custom,...checked];localStorage.setItem(BANK_KEY,JSON.stringify({schemaVersion:1,questions:next}));custom=next;questions.push(...checked);pendingImport=null;renderBank();statusBox('import-status',`已匯入 ${checked.length} 題。可練習題共 ${available().length} 題。`)}catch(e){statusBox('import-status','未匯入：'+e.message,true)}}\nfunction downloadTemplate(){downloadJSON('nihongo-import-example.json',{schemaVersion:1,questions:[{id:'my-n5-001',level:'N5',domain:'文法・讀解',category:'助詞',difficulty:'入門',question:'毎日、日本語（　）勉強します。',options:['を','に','へ','と'],answer:0,explanation:'勉強的受詞「日本語」後用「を」。に與へ可表示移動目的地，と常表示和；此句均不適用。',source:'自編題目，請人工審核',reviewStatus:'draft',version:1}]})}\nasync function restoreBackup(input){try{\n const raw=await readJSONFile(input.files[0]);const v3=raw.type==='nihongo-backup';if(v3&&raw.schemaVersion!==1)throw Error('不支援此備份版本。');const incoming=v3?raw.learning:raw;\n if(!incoming||!Array.isArray(incoming.attempts)||!Array.isArray(incoming.completed))throw Error('不是有效的學習紀錄備份。');\n if(incoming.attempts.length>200000||incoming.completed.length>200000)throw Error('備份紀錄過大。');\n const attempts=incoming.attempts.map(a=>{if(!a||typeof a.id!=='string'||typeof a.correct!=='boolean'||typeof a.time!=='string'||!Number.isFinite(Date.parse(a.time)))throw Error('作答紀錄欄位不完整。');return {id:a.id,correct:a.correct,time:a.time,...(Number.isInteger(a.selectedAnswer)&&a.selectedAnswer>=0&&a.selectedAnswer\u003c4?{selectedAnswer:a.selectedAnswer}:{}),...(Number.isInteger(a.questionVersion)?{questionVersion:a.questionVersion}:{})}});\n if(incoming.completed.some(x=>typeof x!=='string'))throw Error('completed 必須是文字陣列。');\n let additions=[];if(v3){if(!Array.isArray(raw.customBank))throw Error('備份缺少自訂題庫。');const batchIds=new Set;for(const q of raw.customBank){if(!q||batchIds.has(q.id))throw Error('備份自訂題庫 ID 重複。');batchIds.add(q.id);const old=questions.find(x=>x.id===q.id);if(old&&JSON.stringify(old)!==JSON.stringify(Object.fromEntries(Object.keys(old).map(k=>[k,q[k]]))))throw Error('同 ID 題目內容衝突：'+q.id);if(!old)additions.push(q)}if(additions.length)additions=validateBank({schemaVersion:1,questions:additions},questions)}\n const map=new Map;[...state.attempts,...attempts].forEach(a=>map.set(a.id+'|'+a.time+'|'+a.correct,a));const nextState={...state,attempts:[...map.values()].sort((a,b)=>Date.parse(a.time)-Date.parse(b.time)),completed:[...new Set([...state.completed,...incoming.completed])]},nextCustom=[...custom,...additions];\n const oldBank=localStorage.getItem(BANK_KEY);try{localStorage.setItem(BANK_KEY,JSON.stringify({schemaVersion:1,questions:nextCustom}));localStorage.setItem(KEY,JSON.stringify(nextState))}catch(e){if(oldBank===null)localStorage.removeItem(BANK_KEY);else localStorage.setItem(BANK_KEY,oldBank);throw e}\n const n=nextState.attempts.length-state.attempts.length;state=nextState;custom=nextCustom;questions.push(...additions);updateHero();statusBox('restore-status',`還原完成：新增 ${n} 筆作答、${additions.length} 題；原有紀錄保留。`);\n }catch(e){statusBox('restore-status','未還原：'+e.message,true)}}\n\n\n\u003c/script>\n\u003cscript>\n'use strict';\nconst C=NHCore,S=NHStorage,courses=AppData.courses.courses;\nconst v3Go=go,v3Start=startQuiz,v3Setup=quizSetup;\nlet currentCourse=null,preparedBank=null;\nfunction writeState(){return S.saveLearning(state)}\nsave=writeState;\nfunction rememberSession(){state.resume=session?C.clone(session):null;writeState()}\nfunction demoNotice(){return `\u003cdiv class=\"demo-banner\">示範預覽：原 V3 題目仍可試做，尚未獨立人工審核。新增候選題不會進入練習，正式發布題目前為 ${questions.filter(q=>q.reviewStatus==='published').length} 題。聽力播放尚未開放。\u003c/div>`}\nfunction dueIds(){const d=C.derived(state);return Object.keys(d).filter(id=>Date.parse(d[id].nextReview)\u003c=Date.now()&&available().some(q=>q.id===id))}\ngo=function(page){\n if(session)rememberSession();currentCourse=null;\n v3Go(page);\n if(page==='home')renderHome();\n if(page==='levels')renderCourses();\n if(page==='learn'){\n  root.insertAdjacentHTML('beforeend',panel(`\u003ch3>五十音補充教學\u003c/h3>\u003cp class=\"muted\">以下為待審核教學示範。瀏覽器語音僅供備援，裝置間可能不同；尚無經驗證音檔及聽音測驗。\u003c/p>${AppData.kana.supplements.map((s,i)=>`\u003cdetails>\u003csummary>${esc(s.title)}\u003c/summary>\u003cp>${esc(s.description)}\u003c/p>\u003cdiv class=\"kana-mini\">${s.items.map(([k,r],j)=>`\u003cbutton class=\"tile\" onclick=\"playSupplement(${i},${j})\">\u003cspan class=\"kana\">${esc(k)}\u003c/span>\u003cbr>${esc(r)}\u003c/button>`).join('')}\u003c/div>\u003c/details>`).join('')}\u003cdetails>\u003csummary>易混淆假名與拼音輸入\u003c/summary>\u003cp>シ／ツ：筆畫方向不同；ソ／ン：注意起筆與長筆畫方向。先看字形，再練習拼音。\u003c/p>\u003cbutton class=\"btn secondary\" onclick=\"startKanaInput()\">羅馬拼音輸入示範\u003c/button>\u003c/details>`));\n }\n if(page==='stats'){\n  const d=C.derived(state);root.insertAdjacentHTML('beforeend',panel(`\u003ch3>複習與課程進度\u003c/h3>\u003cp>完成 ${state.completed.filter(id=>courses.some(c=>c.id===id)).length} / ${courses.length} 課；到期 ${dueIds().length} 題。\u003c/p>\u003cp class=\"muted\">簡化間隔：答錯隔 1 天；連續答對依序隔 1、3、7、14、30 天。熟練度為連續答對次數 × 25，上限 100，並非能力評鑑。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>題目\u003c/th>\u003cth>錯誤次數\u003c/th>\u003cth>熟練度\u003c/th>\u003cth>下次複習\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${Object.entries(d).slice(-30).map(([id,g])=>`\u003ctr>\u003ctd>${esc(id)}\u003c/td>\u003ctd>${g.wrong}\u003c/td>\u003ctd>${g.mastery}%\u003c/td>\u003ctd>${esc(new Date(g.nextReview).toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei'}))}\u003c/td>\u003c/tr>`).join('')||'\u003ctr>\u003ctd colspan=\"4\">尚無紀錄\u003c/td>\u003c/tr>'}\u003c/tbody>\u003c/table>\u003c/div>`));\n }\n const el=document.getElementById('app-notices');if(el){el.textContent=S.errors.filter(Boolean).join('\\n');el.className=el.textContent?'status error':'hidden'}\n};\nfunction renderHome(){\n const date=C.today(),todayAttempts=state.attempts.filter(a=>C.today(new Date(a.time))===date),newCount=todayAttempts.length;const due=dueIds();const target=courses.find(c=>!state.completed.includes(c.id))||courses[0];\n const resume=state.resume;const courseDue=courses.filter(c=>{const at=(state.courseCompletions||{})[c.id];if(!at)return false;const days=Math.floor((Date.now()-Date.parse(at))/86400000);return c.reviewDays.some(d=>d===days)||days>c.reviewDays.at(-1)});\n root.innerHTML=panel(`\u003ch2>今日學習任務\u003c/h2>\u003cp>${esc(date)} · 依本機紀錄安排，不使用即時 AI。\u003c/p>\u003cdiv class=\"grid\">\u003cdiv class=\"tile\">\u003ch3>① 練習 10 題\u003c/h3>\u003cp>${Math.min(10,newCount)} / 10 ${newCount>=10?'✓ 已完成':''}\u003c/p>\u003cbutton class=\"btn\" onclick=\"startQuiz('all')\">開始練習\u003c/button>\u003c/div>\u003cdiv class=\"tile\">\u003ch3>② 到期複習\u003c/h3>\u003cp>${due.length} 題到期\u003c/p>\u003cbutton class=\"btn\" ${due.length?'':'disabled'} onclick=\"startDue()\">開始複習\u003c/button>\u003c/div>\u003cdiv class=\"tile\">\u003ch3>③ 課程進度\u003c/h3>\u003cp>${state.completed.filter(id=>courses.some(c=>c.id===id)).length} / ${courses.length} 課\u003c/p>\u003cbutton class=\"btn\" onclick=\"openCourse('${target.id}')\">${esc(target.title)}\u003c/button>\u003c/div>\u003c/div>${courseDue.map(c=>`\u003cp>課程複習提醒：\u003cbutton class=\"btn secondary\" onclick=\"openCourse('${c.id}')\">${esc(c.title)}\u003c/button>\u003c/p>`).join('')}`)+panel(`\u003ch3>接續學習\u003c/h3>${resume?`\u003cp>上次練到第 ${resume.idx+1} / ${resume.list.length} 題。\u003c/p>\u003cbutton class=\"btn\" onclick=\"resumePractice()\">繼續上次練習\u003c/button>`:state.lastCourse?`\u003cbutton class=\"btn\" onclick=\"openCourse('${esc(state.lastCourse)}')\">回到上次課程\u003c/button>`:'\u003cp>尚無中斷的練習，選擇一個分類開始。\u003c/p>'}\u003cp>\u003cbutton class=\"btn secondary\" onclick=\"go('quiz')\">選擇練習分類\u003c/button> \u003cbutton class=\"btn secondary\" onclick=\"go('bank')\">題庫與備份\u003c/button>\u003c/p>`)+panel(demoNotice()+`\u003cp>共 ${questions.length} 題；N5 ${questions.filter(q=>q.level==='N5').length} 題候選，包含 ${questions.filter(q=>q.kind==='listening').length} 題未製作音檔的聽力草稿。\u003c/p>\u003cp class=\"muted\">本版為開發預覽，尚未完成實際瀏覽器驗收及獨立人工內容審核。會員與金流未啟用。\u003c/p>`);\n}\nquizSetup=function(){v3Setup();root.insertAdjacentHTML('afterbegin',demoNotice());const count=document.getElementById('pool-count');if(count&&filteredPool().length===0)count.textContent='目前沒有符合條件的可練習題目。候選題需完成審核與發布；請切換分類或前往題庫管理。'};\nfunction renderCourses(){root.innerHTML=panel(`\u003ch2>N5 示範課程\u003c/h2>\u003cp>保留原分類練習，新增資料驅動的課程。課程及題目均為待審核示範。\u003c/p>${courses.filter(c=>c.availability!==\"planned\").map(c=>`\u003cdiv class=\"course-item\">\u003ch3>${esc(c.title)}\u003c/h3>\u003cp>${esc(c.objectives.join('；'))}\u003c/p>\u003cp class=\"muted\">${c.questionIds.length} 題 · 全部作答且達 ${c.completion.minAccuracy*100}% 可標記示範課完成 ${state.completed.includes(c.id)?'✓ 已完成':''}\u003c/p>\u003cbutton class=\"btn\" onclick=\"openCourse('${c.id}')\">開始課程\u003c/button>\u003c/div>`).join('')}`)+panel(`\u003ch3>分級題庫\u003c/h3>\u003cdiv class=\"grid\">${C.levels.slice(1).map(l=>`\u003cdiv class=\"tile\">\u003ch3>${l}\u003c/h3>\u003cp>${available().filter(q=>q.level===l).length} 題可試做\u003c/p>\u003cbutton class=\"btn secondary\" onclick=\"levelPractice('${l}')\">分類練習\u003c/button>\u003c/div>`).join('')}\u003c/div>`)}\nfunction openCourse(id){const c=courses.find(c=>c.id===id);if(!c){go('levels');S.notice('找不到課程：'+id);return}if(session)rememberSession();session=null;currentCourse=id;state.lastCourse=id;writeState();setPage('levels');root.innerHTML=panel(`\u003cspan class=\"tag\">N5 · 示範課程 · 待審核\u003c/span>\u003ch2 style=\"margin-top:16px\">${esc(c.title)}\u003c/h2>\u003ch3>學習目標\u003c/h3>\u003cul>${c.objectives.map(x=>`\u003cli>${esc(x)}\u003c/li>`).join('')}\u003c/ul>\u003ch3>新單字\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"vocab-table\">\u003cthead>\u003ctr>\u003cth>單字\u003c/th>\u003cth>讀音\u003c/th>\u003cth>意思\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${c.vocabulary.map(v=>`\u003ctr>${v.map(x=>`\u003ctd>${esc(x)}\u003c/td>`).join('')}\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/div>\u003ch3 style=\"margin-top:22px\">文法與例句\u003c/h3>${c.grammar.map(g=>`\u003cdiv class=\"course-item\">\u003ch3>${esc(g.title)}\u003c/h3>\u003cp>${esc(g.explanation)}\u003c/p>\u003cdiv class=\"lesson-example\">\u003cp lang=\"ja\">${esc(g.example)}\u003c/p>\u003cp>${esc(g.translation)}\u003c/p>\u003c/div>\u003c/div>`).join('')}\u003ch3>常見錯誤\u003c/h3>\u003cul>${c.commonMistakes.map(x=>`\u003cli>${esc(x)}\u003c/li>`).join('')}\u003c/ul>\u003cp class=\"muted\">全部作答且答對率達 ${c.completion.minAccuracy*100}%，標記本示範課完成。建議完成後第 ${c.reviewDays.join('、')} 天複習；首頁會依完成時間提示。正式學習認證尚未提供。\u003c/p>\u003cbutton class=\"btn\" onclick=\"startCourseQuiz('${id}')\">課後練習\u003c/button> \u003cbutton class=\"btn secondary\" onclick=\"go('levels')\">回到課程列表\u003c/button>`)}\nfunction launchPool(pool,extra={}){if(!pool.length){go('quiz');S.notice('沒有可練習題目。');return}session={list:[...pool],idx:0,score:0,answered:false,answerLog:[],...extra};setPage('quiz');renderQuiz();rememberSession()}\nfunction startCourseQuiz(id){const c=courses.find(c=>c.id===id);if(!c)return;const pool=c.questionIds.map(id=>available().find(q=>q.id===id));if(pool.some(q=>!q)){S.notice('本課題目尚未備齊或尚未發布，暫時無法練習。');return}launchPool(pool,{courseId:id})}\nstartQuiz=function(mode){v3Start(mode);if(session){session.answerLog=[];rememberSession()}};\nfunction startDue(){launchPool(available().filter(q=>dueIds().includes(q.id)).slice(0,20),{mode:'due'})}\nfunction resumePractice(){if(!state.resume)return;try{C.validateLearning(state);session=C.clone(state.resume);setPage('quiz');renderQuiz()}catch(e){S.notice('無法續練，原資料保留：'+e.message)}}\nfunction renderQuiz(){\n if(!session)return;\n if(session.idx>=session.list.length){finishSession();return}\n const q=session.list[session.idx];if(!session.answered||!session.shuffled)session.shuffled=shuffle(q.options.map((text,i)=>({text,i})));\n root.innerHTML=panel(`\u003cdiv class=\"flex\">\u003cspan class=\"tag\">${esc(q.level+' · '+q.category)}\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan>第 ${session.idx+1} / ${session.list.length} 題\u003c/span>\u003c/div>\u003cdiv class=\"progress\" style=\"margin:16px 0\">\u003cdiv style=\"width:${session.idx/session.list.length*100}%\">\u003c/div>\u003c/div>\u003cdiv class=\"question\" lang=\"ja\">${esc(q.question)}\u003c/div>\u003cdiv class=\"options\">${session.shuffled.map((o,j)=>`\u003cbutton type=\"button\" id=\"opt-${j}\" onclick=\"answer(${j})\" ${session.answered?'disabled':''} class=\"answer-option ${session.answered?(o.i===q.answer?'correct':o.i===session.selected?'wrong':''):''}\">\u003cstrong>${String.fromCharCode(65+j)}.\u003c/strong> ${esc(o.text)}\u003c/button>`).join('')}\u003c/div>\u003cdiv id=\"feedback\" style=\"margin-top:16px\">\u003c/div>\u003cp class=\"meta\">${esc(q.id+' · v'+q.version+' · '+q.domain+' / '+q.category)}\u003cbr>${esc(q.source)}\u003c/p>\u003cbutton class=\"btn secondary\" onclick=\"go('quiz')\">暫停並保留進度\u003c/button>`);\n if(session.answered)renderFeedback();\n}\n// Replace only the quiz functions that need durable snapshots and resume support.\nfunction renderFeedback(){const q=session.list[session.idx],ok=session.selected===q.answer;document.getElementById('feedback').innerHTML=`\u003cdiv class=\"notice\" style=\"border-color:${ok?'#2b9c63':'#c95555'}\">\u003cstrong>${ok?'答對了！':'答錯了'}\u003c/strong>\u003cp>正確答案：${esc(q.options[q.answer])}\u003c/p>\u003cp>${esc(q.explanation)}\u003c/p>\u003c/div>\u003cp>\u003cbutton class=\"btn\" onclick=\"nextQuestion()\">${session.idx+1===session.list.length?'查看結果':'下一題 →'}\u003c/button>\u003c/p>`}\nanswer=function(j){if(!session||session.answered||!Number.isInteger(j)||j\u003c0||j>3)return;const q=session.list[session.idx],picked=session.shuffled[j];if(!picked)return;const correct=picked.i===q.answer;session.answered=true;session.selected=picked.i;if(correct)session.score++;session.answerLog=session.answerLog||[];session.answerLog.push({id:q.id,correct});const a={attemptId:globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():'a-'+Date.now()+'-'+Math.random().toString(36).slice(2),id:q.id,questionVersion:q.version,selectedAnswer:picked.i,correct,time:new Date().toISOString(),snapshot:C.clone(q),...(session.courseId?{courseId:session.courseId}:{})};state.attempts.push(a);rememberSession();renderQuiz();updateHero()};\nnextQuestion=function(){if(!session||!session.answered)return;session.idx++;session.answered=false;session.shuffled=null;session.selected=null;if(session.idx\u003csession.list.length)rememberSession();renderQuiz()};\nfunction finishSession(){const done=session;let courseMessage='';if(done.courseId){const c=courses.find(c=>c.id===done.courseId);if(c&&done.score/done.list.length>=c.completion.minAccuracy&&(done.answerLog||[]).length===c.questionIds.length){if(!state.completed.includes(c.id))state.completed.push(c.id);state.courseCompletions={...(state.courseCompletions||{}),[c.id]:new Date().toISOString()};courseMessage='已完成本示範課，首頁將提醒課程複習。'}else courseMessage='尚未達到本示範課完成條件，可回課程複習後再試。'}session=null;state.resume=null;const saved=writeState();root.innerHTML=panel(`\u003ch2>練習完成\u003c/h2>\u003cp class=\"question\">${done.score} / ${done.list.length}\u003c/p>\u003cp>${saved?'紀錄已儲存於目前瀏覽器。':'紀錄尚未儲存成功，請立即下載備份。'}\u003c/p>\u003cp>${esc(courseMessage)}\u003c/p>\u003cdiv class=\"flex\">\u003cbutton class=\"btn\" onclick=\"go('quiz')\">選擇練習範圍\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"go('review')\">錯題複習\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"go('home')\">學習首頁\u003c/button>\u003c/div>`)}\nfunction playSupplement(i,j){speakJapanese(AppData.kana.supplements[i].items[j][0])}\nlet inputKana=null;\nfunction startKanaInput(){const pair=kana[Math.floor(Math.random()*kana.length)];inputKana=pair;root.innerHTML=panel(`\u003ch2>羅馬拼音輸入示範\u003c/h2>\u003cp>使用本網站字卡拼音；し接受 shi／si、ち接受 chi／ti、つ接受 tsu／tu、ふ接受 fu／hu。\u003c/p>\u003cdiv class=\"question\">${esc(pair[0])}\u003c/div>\u003clabel for=\"kana-input\">輸入羅馬拼音\u003c/label>\u003cinput id=\"kana-input\" autocomplete=\"off\" autocapitalize=\"none\" onkeydown=\"if(event.key==='Enter')checkKanaInput()\">\u003cbutton class=\"btn\" onclick=\"checkKanaInput()\">檢查\u003c/button>\u003cp id=\"kana-result\" role=\"status\">\u003c/p>\u003cbutton class=\"btn secondary\" onclick=\"startKanaInput()\">下一個\u003c/button>\u003cp class=\"muted\">此輸入示範暫不計入題庫作答統計。\u003c/p>`)}\nfunction checkKanaInput(){if(!inputKana)return;const v=document.getElementById('kana-input').value.trim().toLowerCase(),r=inputKana[1],aliases={shi:['si'],chi:['ti'],tsu:['tu'],fu:['hu'],wo:['o']};statusBox('kana-result',(v===r||(aliases[r]||[]).includes(v))?'正確！':'答案是 '+r,!(v===r||(aliases[r]||[]).includes(v)))}\nfunction customFromMerged(merged){return merged.filter(q=>{const b=BUILTIN.find(b=>b.id===q.id);return !b||C.stable(b)!==C.stable(q)})}\nfunction backupObject(){return {type:'nihongo-backup',schemaVersion:2,exportedAt:new Date().toISOString(),bank:{schemaVersion:2,questions:C.clone(questions)},learning:C.clone(state)}}\ndownloadBackup=function(){downloadJSON('nihongo-backup-v4.json',backupObject())};\nexportBank=function(){downloadJSON('nihongo-question-bank-v4.json',{schemaVersion:2,questions})};\nexportData=function(){downloadJSON('nihongo-learning-v4.json',state)};\nfunction downloadRaw(){downloadJSON('nihongo-raw-storage.json',{type:'raw-storage-preservation',data:S.rawBackup()})}\nrenderBank=function(){preparedBank=null;root.innerHTML=panel(`\u003ch2>題庫管理\u003c/h2>\u003cp>共 ${questions.length} 題；已發布 ${questions.filter(q=>q.reviewStatus==='published').length}、已核准 ${questions.filter(q=>q.reviewStatus==='approved').length}、未審核 ${questions.filter(q=>['draft','pending_review'].includes(q.reviewStatus)).length}。\u003c/p>${demoNotice()}\u003cdiv class=\"flex\">\u003cbutton class=\"btn\" onclick=\"exportBank()\">匯出完整題庫 JSON\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"downloadBackup()\">備份題庫與學習紀錄\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"downloadTemplate()\">下載匯入範例\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"downloadRaw()\">保留原始儲存資料\u003c/button>\u003c/div>\u003ch3 style=\"margin-top:22px\">匯入題庫或新版本\u003c/h3>\u003cp>同 ID 同內容會略過；修改須提高 version，系統保存舊版本。匯入不會自動核准題目。已發布題修改後需重新取得該版本的人工審核紀錄。\u003c/p>\u003clabel>選擇 JSON 檔\u003cinput id=\"bank-file\" type=\"file\" accept=\".json,application/json\" onchange=\"readBankFile(this)\">\u003c/label>\u003clabel for=\"bank-json\">或貼上 JSON\u003c/label>\u003ctextarea id=\"bank-json\" oninput=\"preparedBank=null;document.getElementById('commit-import').disabled=true\">\u003c/textarea>\u003cdiv class=\"flex\">\u003cbutton class=\"btn secondary\" onclick=\"previewImport()\">檢查並預覽\u003c/button>\u003cbutton class=\"btn\" id=\"commit-import\" disabled onclick=\"commitImport()\">確認匯入\u003c/button>\u003c/div>\u003cp id=\"import-status\" role=\"status\">\u003c/p>\u003cdiv id=\"import-preview\">\u003c/div>\u003cdetails>\u003csummary>資料格式與審核流程\u003c/summary>\u003cp>schemaVersion=2。題目欄位見 data/question-bank.json。狀態：draft 草稿 → pending_review 待審核 → approved 已核准 → published 已發布；disabled 停用。正式練習只使用 published；原 V3 示範題另以 legacyDemo 保留試做。\u003c/p>\u003cp>發布須有授權確認及同版本人工審核紀錄（type=human、reviewer、at、japanese、uniqueAnswer、traditionalChinese）。這是本機管理流程，無法驗證審核者身分；正式商業後台須在伺服器管控。無音檔聽力不可發布。\u003c/p>\u003c/details>`)+panel(`\u003ch3>還原備份\u003c/h3>\u003cp>支援 V2 紀錄及 V3／V4 備份。合併作答與課程進度，保留現有資料；版本衝突會拒絕整批，不會清除原紀錄。\u003c/p>\u003clabel>選擇備份 JSON\u003cinput id=\"backup-file\" type=\"file\" accept=\".json,application/json\" onchange=\"restoreBackup(this)\">\u003c/label>\u003cp id=\"restore-status\" role=\"status\">\u003c/p>`)+panel(`\u003ch3>題庫清單\u003c/h3>\u003clabel>搜尋 ID、題目或分類\u003cinput id=\"bank-search\" type=\"search\" oninput=\"renderBankList(this.value)\">\u003c/label>\u003cdiv id=\"bank-list\">\u003c/div>`);renderBankList('')};\nreadBankFile=async function(input){preparedBank=null;document.getElementById('commit-import').disabled=true;try{const raw=await readJSONFile(input.files[0]);document.getElementById('bank-json').value=JSON.stringify(raw,null,2);previewImport()}catch(e){statusBox('import-status',e.message,true)}};\npreviewImport=function(){preparedBank=null;document.getElementById('commit-import').disabled=true;document.getElementById('import-preview').textContent='';try{const incoming=C.validateBank(JSON.parse(document.getElementById('bank-json').value.replace(/^\\uFEFF/,'')));const merged=C.mergeBank(questions,incoming);preparedBank={incoming,merged};const hints=C.similar([...questions.filter(q=>!incoming.some(x=>x.id===q.id)),...incoming]).filter(p=>incoming.some(q=>q.id===p.a||q.id===p.b));statusBox('import-status',`格式檢查通過 ${incoming.length} 題。高相似提示 ${hints.length} 組；仍須人工語意審核。`);document.getElementById('import-preview').innerHTML=incoming.slice(0,10).map(q=>`\u003cp>${esc(q.id+' · v'+q.version+' · '+statusName(q.reviewStatus)+' · '+q.question)}\u003c/p>`).join('')+hints.slice(0,10).map(h=>`\u003cp class=\"notice\">${esc(h.a+' / '+h.b)} · 相似度 ${h.similarity}%\u003c/p>`).join('');document.getElementById('commit-import').disabled=false}catch(e){statusBox('import-status','未匯入：'+e.message,true)}};\ncommitImport=function(){if(!preparedBank)return;try{const incoming=C.validateBank({schemaVersion:2,questions:preparedBank.incoming}),merged=C.mergeBank(questions,incoming),nextCustom=customFromMerged(merged);S.saveBank(nextCustom);custom=nextCustom;questions.splice(0,questions.length,...merged);renderBank();statusBox('import-status','匯入完成；同內容題目略過，修改的舊版本已保留。')}catch(e){statusBox('import-status','未匯入：'+e.message,true)}};\ndownloadTemplate=function(){const q=C.clone(questions.find(q=>q.kind==='grammar'));q.id='my-n5-001';q.question='毎日、日本語（　）勉強します。';q.options=['を','に','へ','と'];q.answer=0;q.explanation='勉強的受詞日本語後用を。に與へ可標示目的地，と可表示和，皆不適用此受詞位置。';q.reviewStatus='draft';q.legacyDemo=false;q.courseIds=[];q.history=[];q.reviewRecords=[];q.licenseStatus='original_pending';q.generationBatch='manual-import';q.version=1;downloadJSON('nihongo-import-example-v4.json',{schemaVersion:2,questions:[q]})};\nasync function restoreObject(raw){const isBackup=raw&&raw.type==='nihongo-backup';if(isBackup&&![1,2].includes(raw.schemaVersion))throw Error('不支援此備份版本。');const incomingLearning=C.validateLearning(isBackup?raw.learning:raw);let incoming=[];if(isBackup&&raw.schemaVersion===2)incoming=C.validateBank(raw.bank,[],true);else if(isBackup){if(!Array.isArray(raw.customBank))throw Error('缺少自訂題庫。');incoming=C.validateBank({schemaVersion:1,questions:raw.customBank},[],true)}const merged=C.mergeBank(questions,incoming),nextCustom=customFromMerged(merged),nextLearning=C.mergeLearning(state,incomingLearning);S.saveBoth(nextLearning,nextCustom);state=nextLearning;custom=nextCustom;questions.splice(0,questions.length,...merged);updateHero();return true}\nrestoreBackup=async function(input){try{await restoreObject(await readJSONFile(input.files[0]));statusBox('restore-status','還原完成。原有紀錄保留；相同紀錄不重複加入。')}catch(e){statusBox('restore-status','未還原：'+e.message,true)}};\n// Show the actual historical question, even after the bank is revised.\nconst afterGo=go;\ngo=function(page){afterGo(page);if(page==='stats')root.insertAdjacentHTML('beforeend',panel(`\u003ch3>近期作答題目快照\u003c/h3>\u003cdiv class=\"result-list\">${state.attempts.slice(-10).reverse().map(a=>`\u003cdetails>\u003csummary>${esc(a.id)} · ${a.correct?'正確':'錯誤'} · ${a.questionVersion?'v'+a.questionVersion:'舊紀錄未記版本'}\u003c/summary>${a.snapshot?`\u003cp>${esc(a.snapshot.question)}\u003c/p>\u003cp>正確答案：${esc(a.snapshot.options[a.snapshot.answer])}\u003c/p>\u003cp>${esc(a.snapshot.explanation)}\u003c/p>`:'\u003cp>原始紀錄未保存題目快照，保留作答結果，不推定當時題目版本。\u003c/p>'}\u003c/details>`).join('')||'\u003cp>尚無紀錄。\u003c/p>'}\u003c/div>`))};\ntry{go('home')}catch(e){S.notice('初始化失敗，原資料未清除：'+e.message);root.innerHTML=panel('\u003ch2>網站載入失敗\u003c/h2>\u003cp>請保留此檔案及瀏覽器資料，下載原始儲存備份後再處理。\u003c/p>\u003cbutton class=\"btn\" onclick=\"downloadRaw()\">下載原始儲存資料\u003c/button>')}\n\n\u003c/script>\n\u003cscript>\n'use strict';\nconst M=NHManage,MGMT_KEY='nihongo-management-v41';\nlet management=M.empty(),managementBlocked=false;\ntry{const raw=localStorage.getItem(MGMT_KEY);if(raw!==null)management=M.validateDoc(JSON.parse(raw))}catch(e){managementBlocked=true;S.notice('回報與審核紀錄載入失敗，原資料保留並停止管理寫入：'+e.message)}\nconst categoryNames={answer:'答案錯誤',explanation:'解析錯誤',translation:'翻譯不自然',duplicate:'題目重複',other:'其他'};\nconst reportNames={open:'待處理',triaged:'處理中',resolved:'已解決',dismissed:'不採納'};\nconst actionNames={edit:'修改',submit:'送審',approve:'核准',return:'退回',publish:'發布',disable:'停用'};\nconst uniqueId=p=>p+'-'+(globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));\nconst iso=()=>new Date().toISOString();\nlet adminFilters={search:'',level:'all',kind:'all',status:'all',knowledge:'all'},adminSelected=null;\nfunction commitManagement(next,nextQuestions=questions,label='更新管理紀錄'){\n if(managementBlocked)throw Error('管理資料載入有錯誤，無法覆寫；請先下載原始儲存資料。');\n const valid=M.validateDoc(next);M.validateReferences(nextQuestions);const nextCustom=customFromMerged(nextQuestions);S.saveAll(state,nextCustom,valid,label);management=valid;custom=nextCustom;questions.splice(0,questions.length,...nextQuestions);\n}\nfunction keepQuestion(id,field){if(!['favoriteIds','laterReviewIds'].includes(field))return;const old=state[field]||[];if(!old.includes(id)&&!questions.some(q=>q.id===id))return;const next=old.includes(id)?old.filter(x=>x!==id):[...old,id];const candidate={...state,[field]:next};if(S.saveLearning(candidate)){state=candidate;updateQuestionTools()}else S.notice('標記未儲存成功，原標記保留。')}\nconst renderQuiz41=renderQuiz;\nrenderQuiz=function(){renderQuiz41();if(session&&session.idx\u003csession.list.length)root.insertAdjacentHTML('beforeend',panel('\u003cdiv id=\"question-tools\">\u003c/div>'));updateQuestionTools()};\nfunction updateQuestionTools(){const el=document.getElementById('question-tools');if(!session||!el)return;const q=session.list[session.idx];if(!q)return;el.innerHTML=`\u003cp class=\"muted\">已作答 ${session.idx+(session.answered?1:0)} / ${session.list.length} · 剩餘 ${session.list.length-session.idx-(session.answered?1:0)} 題\u003c/p>\u003cdiv class=\"flex\">\u003cbutton class=\"btn secondary\" aria-pressed=\"${(state.favoriteIds||[]).includes(q.id)}\" onclick=\"keepQuestion('${q.id}','favoriteIds')\">${(state.favoriteIds||[]).includes(q.id)?'★ 已收藏':'☆ 收藏'}\u003c/button>\u003cbutton class=\"btn secondary\" aria-pressed=\"${(state.laterReviewIds||[]).includes(q.id)}\" onclick=\"keepQuestion('${q.id}','laterReviewIds')\">${(state.laterReviewIds||[]).includes(q.id)?'已標記稍後複習':'稍後複習'}\u003c/button>\u003c/div>\u003cdetails>\u003csummary>回報這道題目的問題\u003c/summary>\u003cp class=\"muted\">僅儲存在目前瀏覽器，不會自動傳送給任何人。\u003c/p>\u003clabel>問題分類\u003cselect id=\"report-category\">${M.categories.map(c=>`\u003coption value=\"${c}\">${categoryNames[c]}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel>問題說明\u003ctextarea id=\"report-detail\" maxlength=\"2000\">\u003c/textarea>\u003c/label>\u003cbutton class=\"btn secondary\" onclick=\"submitQuestionReport()\">儲存本機回報\u003c/button>\u003cp id=\"report-status\" role=\"status\">\u003c/p>\u003c/details>`}\nfunction submitQuestionReport(){if(!session)return;try{const q=session.list[session.idx],r=M.report(q,document.getElementById('report-category').value,document.getElementById('report-detail').value,uniqueId('report'),iso());commitManagement({...management,reports:[...management.reports,r]},questions,'建立題目回報');statusBox('report-status','已儲存：'+r. swer('${w.id}')\">${String.fromCharCode(65+i)}. ${esc(label(w))}\u003c/button>`).join('')+'\u003c/div>'}document.getElementById('lesson-body').innerHTML=`\u003cp>單字練習 ${s.idx+1} / ${s.ids.length} · 剩餘 ${s.ids.length-s.idx} 題\u003c/p>\u003ch3 lang=\"ja\">${esc(s.mode==='zh-ja'?word.senses[0].meaning:word.lemma)}\u003c/h3>${controls}\u003cdiv id=\"word-feedback\" role=\"status\">\u003c/div>`}\nfunction chooseWordAnswer(id){if(!wordSession||!wordSession.choices?.some(w=>w.id===id))return;gradeWordAnswer(id,id===wordSession.ids[wordSession.idx])}\nfunction submitWordSpelling(){if(!wordSession||wordSession.mode!=='spelling')return;const value=document.getElementById('word-spelling').value,word=lessonWord(wordSession.ids[wordSession.idx]);gradeWordAnswer(value,IL.normalize(value)===IL.normalize(word.reading))}\nfunction gradeWordAnswer(answer,correct){const s=wordSession;if(!s||s.answered)return;const word=lessonWord(s.ids[s.idx]),p=C.clone(lessonProgress());p.wordAttempts.push({id:lessonAttemptId(),wordId:word.id,mode:s.mode,correct,answer,time:new Date().toISOString()});if(!saveLessonProgress(p)){document.getElementById('word-feedback').textContent='儲存失敗，請重試；原有進度保留。';return}s.answered=true;if(correct)s.score++;document.getElementById('word-feedback').innerHTML=`\u003cdiv class=\"notice\">\u003cstrong>${correct?'答對了！':'答錯了'}\u003c/strong>\u003cp>${esc(word.lemma+'（'+word.reading+'）＝'+word.senses[0].meaning)}\u003c/p>\u003c/div>\u003cbutton class=\"btn\" onclick=\"nextWordQuiz()\">${s.idx+1===s.ids.length?'查看結果':'下一題'}\u003c/button>`;document.querySelectorAll('#lesson-body .options button').forEach(b=>b.disabled=true)}\nfunction nextWordQuiz(){if(!wordSession?.answered)return;wordSession.idx++;renderWordQuiz()}\nfunction renderLessonPractice(){const u=lessonContent.units.find(u=>u.id===lessonView.id);document.getElementById('lesson-body').innerHTML=`\u003ch3>文法互動\u003c/h3>\u003cp>選擇填空或排序；答錯時會顯示相關文法說明。\u003c/p>${u.activityIds.map(id=>{const a=lessonContent.activities.find( rect} / ${s.attempts}\u003c/td>\u003ctd>${s.mastery}%\u003c/td>\u003ctd>${s.nextReview?esc(new Date(s.nextReview).toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei'})):'尚未練習'}\u003c/td>\u003c/tr>`}).join('')}\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">熟練度採簡化規則，不代表正式能力評量。\u003c/p>\u003cbutton class=\"btn secondary\" ${marked.length?'':'disabled'} onclick=\"beginWordQuiz('ja-zh',${esc(JSON.stringify(marked))})\">複習收藏或標記的單字（${marked.length}）\u003c/button>\u003cp>\u003cbutton class=\"btn\" onclick=\"startCourseQuiz('${u.id}')\">原課後測驗／錯題紀錄\u003c/button>\u003c/p>`}\n\nfunction speakLessonWord(id){const word=lessonWord(id);if(word)speakJapanese(word.lemma)}\n\n\u003c/script>\u003c/body>\u003c/html>\n\r\n";const ACCEPTANCE_BUILD_HASH="aa505f97bb6df01a190aaab3b0ce02a5c08eecdacb5cda41185db69010a680d5";

runButton.addEventListener('click',async()=>{
 if(running)return;running=true;runButton.disabled=true;results.textContent='';prefix='nh-acceptance-'+crypto.randomUUID();report={at:new Date().toISOString(),appBuild:ACCEPTANCE_BUILD_HASH,isolatedStoragePrefix:prefix,checks:[],manualPending:['原生鍵盤與觸控','系統檔案選擇與下載','真正關閉瀏覽器後重開','Android實機及音訊'],status:'running'};
 // Only this generated test document changes key names; the production HTML stays untouched.
 const marker='<script>window.NH_ACCEPTANCE={getState:()=>state,getSession:()=>session,getQuestions:()=>questions,getManagement:()=>management,go:(p)=>go(p),start:(p)=>startQuiz(p),restore:(r)=>restoreObject(r),backup:()=>backupObject(),save:()=>writeState(),resume:()=>resumePractice(),lesson:(id,tab)=>openLearningTab(id,tab),activity:(id)=>openGrammarActivity(id)};<\/script>';
 const isolatedHtml=ACCEPTANCE_APP_HTML.replaceAll('nihongo-',prefix+'-').replace('</body>',marker+'</body>');
 try{
 await check('真實 DOM 啟動與隔離 localStorage',async()=>{await waitFrame(isolatedHtml);assert(api(),'程式未初始化');assert(api().getState().attempts.length===0,'測試資料未隔離');assert(api().save()===true,'瀏覽器拒絕 localStorage');assert(dom().querySelector('h1').textContent.includes('日語航線'),'首頁未顯示')});
 await check('分類篩選與空題庫提示',()=>{api().go('quiz');const level=dom().getElementById('filter-level');level.value='N1';level.dispatchEvent(new Event('change',{bubbles:true}));assert(dom().getElementById('pool-count').textContent.includes('沒有'),'缺少空題庫提示')});
 await check('選項可見、DOM點擊批改及解析',()=>{api().start('n5');const session=api().getSession(),q=session.list[0],options=[...dom().querySelectorAll('.options button')];assert(options.length===4,'不是四個選項');options.forEach(el=>{const st=frame.contentWindow.getComputedStyle(el);assert(st.display!=='none'&&st.visibility!=='hidden'&&el.getBoundingClientRect().height>=44,'選項不可見或太小')});const wrong=session.shuffled.findIndex(o=>o.i!==q.answer);options[wrong].click();assert(api().getState().attempts.length===1,'點擊未記錄');assert(dom().getElementById('feedback').textContent.includes(q.explanation),'解析未顯示');assert(dom().querySelectorAll('.options button:disabled').length===4,'批改後未鎖選項')});
 await check('重載後保留紀錄與已答題',async()=>{await waitFrame(isolatedHtml);assert(api().getState().attempts.length===1,'重載遺失紀錄');api().resume();assert(api().getSession().answered,'已答狀態遺失');assert(dom().getElementById('feedback').textContent.includes('正確答案'),'重載未還原解析')});
 await check('錯題重練與下一題按鈕',()=>{api().start('wrong');const s=api().getSession();assert(s&&s.list.length===1,'錯題數不符');const i=s.shuffled.findIndex(o=>o.i===s.list[0].answer);click('opt-'+i);dom().querySelector('#feedback button').click();assert(!api().getSession(),'未完成');assert(dom().getElementById('content').textContent.includes('練習完成'),'缺少結果')});
 await check('管理頁、無效JSON與完整備份還原',async()=>{api().go('bank');const before=api().getQuestions().length;const text=dom().getElementById('bank-json');text.value='{';[...dom().querySelectorAll('button')].find(b=>b.textContent==='檢查並預覽').click();assert(dom().getElementById('import-status').classList.contains('error'),'無效JSON未拒絕');assert(api().getQuestions().length===before,'無效JSON改變題庫');const backup=JSON.parse(JSON.stringify(api().backup()));await api().restore(backup);assert(api().getState().attempts.length===2,'重複還原改變作答數');api().go('admin');assert(dom().getElementById('admin-list').textContent.includes('n5-001'),'管理頁未顯示題庫')});
 await check('本機題目回報與追蹤',()=>{api().start('hira');dom().getElementById('report-category').value='explanation';dom().getElementById('report-detail').value='自動瀏覽器驗收測試資料';[...dom().querySelectorAll('button')].find(b=>b.textContent==='儲存本機回報').click();assert(api().getManagement().reports.length===1,'回報未保存');api().go('admin');assert(dom().getElementById('reports-list').textContent.includes('自動瀏覽器驗收測試資料'),'回報未進入管理頁')});
 await check('桌面及360px框架的長句排版',async()=>{api().start('n5');for(const width of [1200,360]){frame.style.width=width+'px';await nextPaint();const d=dom();assert(d.documentElement.scrollWidth<=width+2,'出現整頁橫向溢出：'+width);assert([...d.querySelectorAll('.options button')].every(el=>el.getBoundingClientRect().width<=width),'選項超出窄畫面')} });
 await check('V4.2課程地圖區分示範與未開放單元',()=>{api().go('levels');assert(dom().getElementById('content').textContent.includes('24單元規劃'),'課程地圖未顯示');assert(!dom().querySelector('[onclick="openCourse(\'n5-unit-04\')"]'),'未完成課程被開放');api().lesson('n5-course-01','words');assert(dom().querySelector('.flashcard'),'單字卡未顯示')});
 await check('V4.2翻卡收藏及重載保存',async()=>{dom().querySelector('.flashcard').click();assert(dom().getElementById('lesson-body').textContent.includes('學生'),'翻卡未顯示詞義');[...dom().querySelectorAll('#lesson-body button')].find(b=>b.textContent==='☆ 收藏').click();assert(api().getState().interactive.favoriteWordIds.includes('word-n5-gakusei'),'單字收藏未保存');await waitFrame(isolatedHtml);assert(api().getState().interactive.favoriteWordIds.includes('word-n5-gakusei'),'重載遺失單字收藏')});
 await check('V4.2點詞使用句中詞義，不猜測未標註人名',()=>{api().lesson('n5-course-02','teaching');dom().querySelector('[aria-label="查看で解釋"]').click();assert(dom().getElementById('word-detail').textContent.includes('動作發生的場所'),'場所で詞義不符');api().lesson('n5-course-03','teaching');dom().querySelector('[aria-label="查看で解釋"]').click();assert(dom().getElementById('word-detail').textContent.includes('交通工具或方法'),'交通で詞義不符');api().lesson('n5-course-01','teaching');assert(!dom().querySelector('[aria-label="查看田中解釋"]'),'未知人名被猜測標註')});
 await check('V4.2文法填空、排序與新進度備份',async()=>{api().lesson('n5-course-01','practice');api().activity('activity-n5-01-fill');dom().getElementById('grammar-fill').value='は';[...dom().querySelectorAll('#lesson-body button')].find(b=>b.textContent==='檢查答案').click();assert(dom().getElementById('grammar-feedback').textContent.includes('答對了'),'填空批改失敗');api().activity('activity-n5-01-order');for(const text of ['これは','田中さんの','本です。'])[...dom().querySelectorAll('#lesson-body button')].find(b=>b.textContent===text).click();[...dom().querySelectorAll('#lesson-body button')].find(b=>b.textContent==='檢查答案').click();assert(dom().getElementById('grammar-feedback').textContent.includes('答對了'),'排序批改失敗');const saved=JSON.parse(JSON.stringify(api().backup()));await api().restore(saved);assert(api().getState().interactive.activityAttempts.length===2,'文法紀錄重複或遺失');assert(api().getState().interactive.favoriteWordIds.includes('word-n5-gakusei'),'備份遺失單字收藏')});
 report.status='automated-browser-checks-passed-manual-pending';document.getElementById('status').textContent='自動瀏覽器檢查完成；仍須人工確認列出的原生操作，不能宣稱完整驗收通過。';
 }catch(e){report.status='failed';document.getElementById('status').textContent='檢查中止：'+e.message+'。請下載結果並保留檔案。'}finally{running=false;runButton.disabled=false;document.getElementById('download').disabled=false}
});
document.getElementById('download').addEventListener('click',()=>{if(!report)return;const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='nihongo-browser-acceptance.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script></html>
