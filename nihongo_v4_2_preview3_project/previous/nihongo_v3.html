</style></head><body><header><h1>🌸 日語航線</h1><span class="tag">V3 · 正式題庫系統</span></header><main><section class="hero"><h2>每天一點點，從五十音走向 N1</h2><p>課程、練習、錯題複習與學習進度，從這裡開始。</p><div class="flex"><button class="btn" style="background:white;color:#294c91" onclick="go('learn')">開始學習</button><span id="heroStat">尚未開始練習</span></div></section><div class="layout"><aside class="panel nav" aria-label="主選單"><button data-page="home" onclick="go('home')">🏠 學習首頁</button><button data-page="learn" onclick="go('learn')">📖 五十音課程</button><button data-page="levels" onclick="go('levels')">🎓 N5～N1 課程</button><button data-page="quiz" onclick="go('quiz')">✏️ 題庫練習</button><button data-page="review" onclick="go('review')">🔁 錯題複習</button><button data-page="stats" onclick="go('stats')">📊 學習分析</button><button data-page="bank" onclick="go('bank')">🗂️ 題庫管理</button><button data-page="plans" onclick="go('plans')">💎 會員方案</button></aside><div id="content" aria-live="polite"><section class="panel"><h2>歡迎來到日語航線 V2</h2><p>五十音課程、N5 示範題、錯題本與學習統計。</p><p>如果此畫面一直沒有變化，請使用 Chrome 或其他瀏覽器開啟下載的 HTML 檔案，不要使用檔案預覽器。</p><button class="btn" onclick="go('learn')">開始學習五十音</button></section></div></div></main><footer>日語航線 V3 · 資料僅儲存於目前瀏覽器 · 非官方 JLPT 網站</footer><script>

const KEY='nihongo-mvp-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{attempts:[],completed:[]}}catch(e){state={attempts:[],completed:[]};}if(!Array.isArray(state.attempts))state.attempts=[];if(!Array.isArray(state.completed))state.completed=[];
let session=null;let kanaTab='hira';const root=document.getElementById('content');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('瀏覽器無法儲存資料，請檢查儲存空間或隱私模式。')}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const panel=x=>`<section class="panel">${x}</section>`;function setPage(p){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}function stats(){let n=state.attempts.length,ok=state.attempts.filter(a=>a.correct).length;return {n,ok,pct:n?Math.round(ok/n*100):0}}function wrongIds(){const latest=new Map;state.attempts.forEach(a=>latest.set(a.id,a));return [...latest.values()].filter(a=>!a.correct).map(a=>a.id)}
function go(p){session=null;setPage(p);let s=stats();document.getElementById('heroStat').textContent=`累積 ${s.n} 次作答 · 正確率 ${s.pct}%`;if(p==='home')root.innerHTML=panel(`<h2>今日學習任務</h2><p>建議先學習五十音，再進入 N5 題庫。</p><div class="grid"><div class="tile"><h3>① 五十音</h3><p>熟悉平假名與發音</p><button class="btn" onclick="go('learn')">開始課程</button></div><div class="tile"><h3>② 練習 10 題</h3><p>隨機抽取已有題目</p><button class="btn" onclick="startQuiz('all')">開始練習</button></div><div class="tile"><h3>③ 錯題複習</h3><p>目前 ${wrongIds().length} 題待複習</p><button class="btn" onclick="go('review')">查看錯題</button></div></div>`)+panel(`<h3>目前版本說明</h3><p class="muted">已提供平假名、片假名、瀏覽器語音、題庫練習、批改、錯題本、學習紀錄。每日任務目前是固定規則示範，正式個人化排程尚未實作。</p>`);
else if(p==='learn'){const current=kanaTab==='hira'?kana:katakana;root.innerHTML=panel(`<h2>五十音 · 假名學習</h2><p>切換平假名與片假名。點擊每個假名可以播放日語發音（依賴瀏覽器的日語語音功能）。</p><div class="flex" style="margin:16px 0"><button class="btn ${kanaTab==='hira'?'':'secondary'}" onclick="switchKana('hira')">平假名</button><button class="btn ${kanaTab==='kata'?'':'secondary'}" onclick="switchKana('kata')">片假名</button><button class="btn secondary" onclick="speakJapanese('あいうえお')">🔊 試聽發音</button></div><div class="grid">${current.map(([k,r])=>`<button class="tile kana-card" onclick="speakJapanese('${k}')" aria-label="播放 ${esc(k)} 發音"><div class="kana">${esc(k)}</div><div>${esc(r)}</div><div class="small muted">🔊 點擊發音</div></button>`).join('')}</div><p class="flex"><button class="btn" onclick="startQuiz('${kanaTab==='hira'?'hira':'kata'}')">測驗${kanaTab==='hira'?'平假名':'片假名'}</button><button class="btn secondary" onclick="startQuiz('kana')">混合測驗</button></p><p class="muted small">提示：部分手機或瀏覽器未安裝日語語音，可能無法播放。濁音、半濁音、拗音與正式音檔將逐步加入。</p>`)}
else if(p==='levels')root.innerHTML=panel(`<h2>分級課程</h2><p>從 N5 逐級學習到 N1。目前只有少量 N5 示範題，其餘級別尚未開放。</p><div class="grid">${['N5','N4','N3','N2','N1'].map((x,i)=>`<div class="tile"><h3>${x}</h3><p>${i===0?'基礎單字、文法與短篇閱讀':'課程規劃中'}</p><button class="btn ${i?'secondary':''}" ${i?'disabled':''} onclick="startQuiz('n5')">${i?'尚未開放':'N5 試做'}</button></div>`).join('')}</div>`);

function switchKana(tab){kanaTab=tab;go('learn')}function speakJapanese(value){if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音播放');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(value);u.lang='ja-JP';u.rate=.78;const voices=speechSynthesis.getVoices();const japanese=voices.find(v=>v.lang.toLowerCase().startsWith('ja'));if(japanese)u.voice=japanese;speechSynthesis.speak(u)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function startQuiz(mode){let pool=mode==='kana'?questions.filter(q=>q.level==='五十音'):mode==='hira'?questions.filter(q=>q.category==='假名'):mode==='kata'?questions.filter(q=>q.category==='片假名'):mode==='n5'?questions.filter(q=>q.level==='N5'):mode==='wrong'?questions.filter(q=>wrongIds().includes(q.id)):questions;if(!pool.length){go('review');return}session={list:shuffle([...pool]).slice(0,10),idx:0,score:0,answered:false};setPage('quiz');renderQuiz()}

"入門","question":"A：これは（　）のかばんですか。B：田中さんのです。","options":["どこ","いつ","だれ","いくら"],"answer":2,"explanation":"回答是田中先生的，問題是在問所有人，因此用「だれの」。どこ問地點，いつ問時間，いくら問價格。","source":"日語航線 V3 原創示範","reviewStatus":"sample","version":1},{"id":"v3-n5-016","level":"N5","domain":"文法・讀解","category":"疑問詞","difficulty":"入門","question":"A：りんごは（　）ですか。B：一つ百円です。","options":["いくら","だれ","どこ","いつ"],"answer":0,"explanation":"回答價格一百日圓，用「いくら」提問。だれ問人，どこ問地點，いつ問時間。","source":"日語航線 V3 原創示範","reviewStatus":"sample","version":1},{"id":"v3-n5-017","level":"N5","domain":"文法・讀解","category":"數量詞","difficulty":"入門","question":"りんごを二（　）買いました。","options":["人","本","つ","枚"],"answer":2,"explanation":"蘋果可使用一般物品的數量詞「つ」：二つ（ふたつ）。人用於人，本用於細長物，枚用於薄片。","source":"日語航線 V3 原創示範","reviewStatus":"sample","version":1},{"id":"v3-n5-018","level":"N5","domain":"文字・語彙","category":"時間表達","difficulty":"入門","question":"「あした」はいつですか。","options":["今天","昨天","明天","前天"],"answer":2,"explanation":"あした（明日）是明天；今天是きょう，昨天是きのう，前天是おととい。","source":"日語航線 V3 原創示範","reviewStatus":"sample","version":1},{"id":"v3-n5-019","level":"N5","domain":"文字・語彙","category":"文脈選詞","difficulty":"入門","question":"朝、先生に会いました。「（　）ございます」と言いました。","options":["おやすみ","おはよう","さようなら","いただきます"],"answer":1,"explanation":"早上向老師問好用「おはようございます」。おやすみ是晚安，さようなら是再見，いただきます是用餐前的話。","source":"日語航線 V3 原創示範","reviewStatus":"sample","version":1},{"id":"v3-n5-020","level":"N5","domain":"文法・讀解","category":"短篇閱讀","difficulty":"入門","question":"わたしは毎日バスで学校へ行きます。でも、今日は歩いて行きました。今日、どうやって学校へ行きましたか。","options":["バスで","電車で","歩いて","自転車で"],"answer":2,"explanation":"「でも、今日は歩いて行きました」說明今天是走路去；每天搭巴士是平常習慣，不能作為今天的答案。","source":"日語航線 V3 原創示範","reviewStatus":"sample","version":1},{"id":"v3-n5-021","level":"N5","domain":"文法・讀解","category":"短篇閱讀","difficulty":"入門","question":"日曜日、花子さんは午前中に部屋を掃除しました。午後は友だちと公園へ行きました。午前中に何をしましたか。","options":["公園へ行きました","友だちと勉強しました","買い物をしました","部屋を掃除しました"],"answer":3,"explanation":"題目問上午。「午前中に部屋を掃除しました」即上午打掃房間；去公園是下午，另兩項文中未提及。","source":"日語航線 V3 原創示範","reviewStatus":"sample","version":1},{"id": function validateBank(raw,existing=[]){
 if(!raw||raw.schemaVersion!==1||!Array.isArray(raw.questions)||!raw.questions.length)throw Error('格式需為 {"schemaVersion":1,"questions":[題目…]}，且至少一題。');
 if(raw.questions.length>10000)throw Error('單次最多匯入 10,000 題。');
 const ids=new Set(existing.map(q=>q.id)),signatures=new Set(existing.map(q=>q.level+'|'+q.question.normalize('NFKC').replace(/\s/g,'')));
 return raw.questions.map((q,i)=>{
  const fail=m=>{throw Error(`第 ${i+1} 題：${m}`)};
  if(!q||typeof q!=='object')fail('必須是題目物件。');
  for(const k of ['id','level','domain','category','difficulty','question','explanation','source','reviewStatus'])if(typeof q[k]!=='string'||!q[k].trim()||q[k].length>10000)fail(`${k} 為必填文字（上限 10,000 字）。`);
  if(!/^[a-zA-Z0-9_-]{1,80}$/.test(q.id))fail('ID 只可使用英數、底線與連字號（1～80 字）。');
  if(ids.has(q.id))fail('ID 重複：'+q.id);
  if(!LEVELS.includes(q.level)||!DOMAINS.includes(q.domain))fail('級別或領域不在支援範圍。');
  if((q.level==='五十音')!==(q.domain==='五十音'))fail('五十音級別與領域必須相符。');
  if(!Array.isArray(q.options)||q.options.length!==4||q.options.some(o=>typeof o!=='string'||!o.trim()||o.length>2000))fail('必須有四個非空白文字選項（各上限 2,000 字）。');
  if(new Set(q.options.map(o=>o.normalize('NFKC').trim())).size!==4)fail('選項不得重複。');
  if(!Number.isInteger(q.answer)||q.answer<0||q.answer>3)fail('answer 必須為 0～3 的整數。');
  if(!Number.isInteger(q.version)||q.version<1)fail('version 必須為正整數。');
  if(!['draft','approved','sample','disabled'].includes(q.reviewStatus))fail('reviewStatus 應為 draft、approved、sample 或 disabled。');
  if(q.domain==='聽解'&&q.reviewStatus!=='draft'&&q.reviewStatus!=='disabled')fail('本版尚未支援聽力音檔，聽解題請先設 draft。');
  const signature=q.level+'|'+q.question.normalize('NFKC').replace(/\s/g,'');
  if(signatures.has(signature))fail('相同級別已有重複題幹。');
  ids.add(q.id);signatures.add(signature);
  return Object.fromEntries(['id','level','domain','category','difficulty','question','options','answer','explanation','source','reviewStatus','version'].map(k=>[k,Array.isArray(q[k])?[...q[k]]:q[k]]));
 });
}

 }
 if(p==='stats'){
 const groups=new Map();for(const a of state.attempts){const q=questions.find(q=>q.id===a.id);const key=q?q.level+' · '+q.domain+' · '+q.category:'未載入題目';const g=groups.get(key)||{n:0,ok:0};g.n++;if(a.correct)g.ok++;groups.set(key,g)}
 root.innerHTML+=panel(`<h3>分類表現</h3><div class="table-wrap"><table><thead><tr><th>分類</th><th>作答次數</th><th>正確率</th></tr></thead><tbody>${[...groups].map(([k,g])=>`<tr><td>${esc(k)}</td><td>${g.n}</td><td>${Math.round(g.ok/g.n*100)}%</td></tr>`).join('')||'<tr><td colspan="3">尚無紀錄</td></tr>'}</tbody></table></div><p class="muted">這是練習正確率，不代表 JLPT 官方尺度得分。</p><button class="btn secondary" onclick="downloadBackup()">備份題庫與學習紀錄</button>`);
 }
};
function levelPractice(l){filters={...filters,level:l,domain:'all',category:'all',mode:'random'};go('quiz')}
startQuiz=function(mode){
 let pool=available();
 if(mode==='filtered')pool=filteredPool();
 else if(mode==='wrong')pool=pool.filter(q=>wrongIds().includes(q.id));
 else if(mode==='n5')pool=pool.filter(q=>q.level==='N5');
 else if(mode==='kana')pool=pool.filter(q=>q.level==='五十音');
 else if(mode==='hira')pool=pool.filter(q=>q.category==='假名');
 else if(mode==='kata')pool=pool.filter(q=>q.category==='片假名');
 if(!pool.length){go(mode==='wrong'?'review':'quiz');return}
 const counts=new Map(),group=new Map();state.attempts.forEach(a=>{counts.set(a.id,(counts.get(a.id)||0)+1);const q=questions.find(q=>q.id===a.id);if(q){const k=q.level+'|'+q.domain+'|'+q.category;const g=group.get(k)||{n:0,wrong:0};g.n++;if(!a.correct)g.wrong++;group.set(k,g)}});
 pool=shuffle([...pool]);
 if(mode==='filtered'&&filters.mode==='weak')pool.sort((a,b)=>{const rate=q=>{const g=group.get(q.level+'|'+q.domain+'|'+q.category);return g?g.wrong/g.n:0};return rate(b)-rate(a)||(counts.get(a.id)||0)-(counts.get(b.id)||0)});
 else pool.sort((a,b)=>(counts.get(a.id)||0)-(counts.get(b.id)||0));
 session={list:pool.slice(0,mode==='filtered'?Number(filters.count):10),idx:0,score:0,answered:false,mode};setPage('quiz');renderQuiz();
};
renderQuiz=function(){legacyRender();if(session){const q=session.list[session.idx];root.insertAdjacentHTML('beforeend',panel(`<p class="meta">${esc(q.domain+' / '+q.category+' · '+q.difficulty+' · '+statusName(q.reviewStatus))}<br>${esc(q.id+' · v'+q.version+' · '+q.source)}</p><button class="btn secondary" onclick="go('quiz')">結束本次練習</button><p class="muted small">已作答的結果會保留。</p>`))}else root.insertAdjacentHTML('beforeend',panel('<button class="btn secondary" onclick="go(\'quiz\')">調整練習範圍</button>'))};
answer=function(j){if(!session||session.answered||!Number.isInteger(j)||j<0||j>=session.shuffled.length)return;const before=state.attempts.length;legacyAnswer(j);if(state.attempts.length>before){const a=state.attempts.at(-1),q=session.list[session.idx];a.selectedAnswer=session.shuffled[j].i;a.questionVersion=q.version;save()}updateHero()};
nextQuestion=function(){if(session&&session.answered){session.idx++;renderQuiz()}};
function downloadJSON(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportBank(){downloadJSON('nihongo-question-bank-v3.json',{schemaVersion:1,questions})}
function downloadBackup(){downloadJSON('nihongo-backup-v3.json',{type:'nihongo-backup',schemaVersion:1,exportedAt:new Date().toISOString(),customBank:custom,learning:state})}
function renderBank(){
 pendingImport=null;
 root.innerHTML=panel(`<h2>題庫管理</h2><p>共 ${questions.length} 題：內建 ${BUILTIN.length}、匯入 ${custom.length}。${available().length} 題可練習。</p><p class="notice">此為離線本機管理，資料只存在目前瀏覽器，不是多人後台。系統會檢查格式與重複資料；答案語意及日文自然度仍需人工審核。待審核、停用與聽解題不會進入練習。</p><div class="flex"><button class="btn" onclick="exportBank()">匯出完整題庫 JSON</button><button class="btn secondary" onclick="downloadBackup()">備份題庫與學習紀錄</button><button class="btn secondary" onclick="downloadTemplate()">下載匯入範例</button></div><h3 style="margin-top:24px">匯入新增題目</h3><p class="muted">只新增題目，不覆蓋同 ID 舊題。若要修改題目，請使用新 ID 與版本。完整題庫匯出檔適合保存，匯回相同題庫會被判定為重複。</p><label>選擇 JSON 檔<input id="bank-file" type="file" accept=".json,application/json" onchange="readBankFile(this)"></label><p>或貼上 JSON：</p><label for="bank-json">題庫 JSON</label><textarea id="bank-json" placeholder='{"schemaVersion":1,"questions":[...]}' oninput="pendingImport=null;document.getElementById('commit-import').disabled=true"></textarea><div class="flex"><button class="btn secondary" onclick="previewImport()">檢查並預覽</button><button class="btn" id="commit-import" disabled onclick="commitImport()">確認匯入</button></div><p id="import-status" role="status"></p><div id="import-preview"></div><details><summary>欄位格式說明</summary><p>必填：id、level、domain、category（細分類）、difficulty、question、四個 options、answer（0 起算）、explanation（繁體中文）、source、reviewStatus、version（正整數）。級別支援五十音、N5～N1；領域支援五十音、文字・語彙、文法・讀解、聽解。</p><p>reviewStatus：draft 待審核、approved 已人工審核、sample 示範、disabled 停用。不能把格式檢查當作人工審核。</p></details>`)+panel(`<h3>還原學習備份</h3><p class="muted">V3 完整備份會合併紀錄及自訂題庫；也可載入 V2 匯出的學習紀錄 JSON。重複紀錄只保留一份，現有資料不清除。</p><label>選擇備份 JSON<input id="backup-file" type="file" accept=".json,application/json" onchange="restoreBackup(this)"></label><p id="restore-status" role="status"></p>`)+panel(`<h3>題庫清單</h3><label>搜尋題目<input id="bank-search" type="search" placeholder="ID、題目、級別、分類" oninput="renderBankList(this.value)"></label><div id="bank-list"></div>`);
 renderBankList('');
}
function renderBankList(search){const list=questions.filter(q=>(q.id+' '+q.level+' '+q.domain+' '+q.category+' '+q.question).toLowerCase().includes(search.toLowerCase()));document.getElementById('bank-list').innerHTML=`<p class="muted">找到 ${list.length} 題（最多顯示前 100 題）</p>`+list.slice(0,100).map(q=>`<details class="bank-row"><summary><span class="pill">${esc(q.level+' · '+statusName(q.reviewStatus))}</span> ${esc(q.question)}</summary><p class="meta">${esc(q.id+' · '+q.domain+' / '+q.category+' · v'+q.version)}</p><ol type="A">${q.options.map((o,i)=>`<li>${esc(o)}${i===q.answer?' ✔':''}</li>`).join('')}</ol><p>${esc(q.explanation)}</p><p class="meta">來源：${esc(q.source)}</p></details>`).join('')}
async function readJSONFile(file){if(!file)throw Error('請先選擇檔案。');if(file.size>10*1024*1024)throw Error('檔案不可超過 10 MB。');return JSON.parse((await file.text()).replace(/^\uFEFF/,''))}
async function readBankFile(input){pendingImport=null;document.getElementById('commit-import').disabled=true;try{const raw=await readJSONFile(input.files[0]);document.getElementById('bank-json').value=JSON.stringify(raw,null,2);previewImport()}catch(e){statusBox('import-status',e.message,true)}}
function previewImport(){pendingImport=null;document.getElementById('commit-import').disabled=true;document.getElementById('import-preview').textContent='';try{pendingImport=validateBank(JSON.parse(document.getElementById('bank-json').value.replace(/^\uFEFF/,'')),questions);statusBox('import-status',`檢查通過，共 ${pendingImport.length} 題。請確認預覽後按「確認匯入」。`);document.getElementById('import-preview').innerHTML=pendingImport.slice(0,10).map(q=>`<p>${esc(q.id+' · '+q.level+' · '+statusName(q.reviewStatus)+' · '+q.question)}</p>`).join('');document.getElementById('commit-import').disabled=false}catch(e){statusBox('import-status',e.message,true)}}
function commitImport(){if(!pendingImport)return;try{const checked=validateBank({schemaVersion:1,questions:pendingImport},questions),next=[...custom,...checked];localStorage.setItem(BANK_KEY,JSON.stringify({schemaVersion:1,questions:next}));custom=next;questions.push(...checked);pendingImport=null;renderBank();statusBox('import-status',`已匯入 ${checked.length} 題。可練習題共 ${available().length} 題。`)}catch(e){statusBox('import-status','未匯入：'+e.message,true)}}
function downloadTemplate(){downloadJSON('nihongo-import-example.json',{schemaVersion:1,questions:[{id:'my-n5-001',level:'N5',domain:'文法・讀解',category:'助詞',difficulty:'入門',question:'毎日、日本語（　）勉強します。',options:['を','に','へ','と'],answer:0,explanation:'勉強的受詞「日本語」後用「を」。に與へ可表示移動目的地，と常表示和；此句均不適用。',source:'自編題目，請人工審核',reviewStatus:'draft',version:1}]})}
async function restoreBackup(input){try{
 const raw=await readJSONFile(input.files[0]);const v3=raw.type==='nihongo-backup';if(v3&&raw.schemaVersion!==1)throw Error('不支援此備份版本。');const incoming=v3?raw.learning:raw;
 if(!incoming||!Array.isArray(incoming.attempts)||!Array.isArray(incoming.completed))throw Error('不是有效的學習紀錄備份。');
 if(incoming.attempts.length>200000||incoming.completed.length>200000)throw Error('備份紀錄過大。');
 const attempts=incoming.attempts.map(a=>{if(!a||typeof a.id!=='string'||typeof a.correct!=='boolean'||typeof a.time!=='string'||!Number.isFinite(Date.parse(a.time)))throw Error('作答紀錄欄位不完整。');return {id:a.id,correct:a.correct,time:a.time,...(Number.isInteger(a.selectedAnswer)&&a.selectedAnswer>=0&&a.selectedAnswer<4?{selectedAnswer:a.selectedAnswer}:{}),...(Number.isInteger(a.questionVersion)?{questionVersion:a.questionVersion}:{})}});
 if(incoming.completed.some(x=>typeof x!=='string'))throw Error('completed 必須是文字陣列。');
 let additions=[];if(v3){if(!Array.isArray(raw.customBank))throw Error('備份缺少自訂題庫。');const batchIds=new Set;for(const q of raw.customBank){if(!q||batchIds.has(q.id))throw Error('備份自訂題庫 ID 重複。');batchIds.add(q.id);const old=questions.find(x=>x.id===q.id);if(old&&JSON.stringify(old)!==JSON.stringify(Object.fromEntries(Object.keys(old).map(k=>[k,q[k]]))))throw Error('同 ID 題目內容衝突：'+q.id);if(!old)additions.push(q)}if(additions.length)additions=validateBank({schemaVersion:1,questions:additions},questions)}
 const map=new Map;[...state.attempts,...attempts].forEach(a=>map.set(a.id+'|'+a.time+'|'+a.correct,a));const nextState={...state,attempts:[...map.values()].sort((a,b)=>Date.parse(a.time)-Date.parse(b.time)),completed:[...new Set([...state.completed,...incoming.completed])]},nextCustom=[...custom,...additions];
 const oldBank=localStorage.getItem(BANK_KEY);try{localStorage.setItem(BANK_KEY,JSON.stringify({schemaVersion:1,questions:nextCustom}));localStorage.setItem(KEY,JSON.stringify(nextState))}catch(e){if(oldBank===null)localStorage.removeItem(BANK_KEY);else localStorage.setItem(BANK_KEY,oldBank);throw e}
 const n=nextState.attempts.length-state.attempts.length;state=nextState;custom=nextCustom;questions.push(...additions);updateHero();statusBox('restore-status',`還原完成：新增 ${n} 筆作答、${additions.length} 題；原有紀錄保留。`);
 }catch(e){statusBox('restore-status','未還原：'+e.message,true)}}

try { go('home'); } catch (error) { console.error('初始化失敗', error); document.getElementById('content').innerHTML='<section class="panel"><h2>網站啟動遇到問題</h2><p>請用 Chrome 開啟下載的 HTML 檔案。如果仍無法使用，請將錯誤畫面傳給我。</p></section>'; }
</script></body></html>
